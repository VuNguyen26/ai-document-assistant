providers = ["node"]

[phases.install]
cmds = ["cd apps/backend && npm install"]

[phases.build]
cmds = ["cd apps/backend && npx prisma generate && npm run build"]

[start]
cmd = "echo DATABASE_URL_EXISTS=$([ -n \"$DATABASE_URL\" ] && echo yes || echo no) && cd apps/backend && npx prisma migrate deploy && node dist/main"